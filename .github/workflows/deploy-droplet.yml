# Builds XApps here (the droplet is too small to build it) and ships it to the droplet over SSH.
# One-time droplet setup and the secrets it needs: deploy/droplet/README.md.
name: Deploy to droplet

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    # The repo's default branch, plus the X player branch while it's in review (drop that once merged).
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch || github.ref_name == 'claude/wizardly-clarke-uidodp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the deploy secrets
        id: check
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::warning::Not deploying: set the DROPLET_HOST and DROPLET_SSH_KEY secrets (see deploy/droplet/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.check.outputs.ready == 'true'

      - name: Build (standalone server)
        if: steps.check.outputs.ready == 'true'
        working-directory: apps/web
        env:
          NEXT_OUTPUT: standalone
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_X_PROVIDER: ${{ secrets.NEXT_PUBLIC_SUPABASE_X_PROVIDER }}
          NEXT_PUBLIC_X_HANDLE: ${{ secrets.NEXT_PUBLIC_X_HANDLE }}
          # Only the default branch syncs the app catalog into the database (others could list unreleased apps).
          SUPABASE_SERVICE_ROLE_KEY: ${{ github.ref_name == github.event.repository.default_branch && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
        run: npm run build

      - name: Package
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bundle"
          mkdir -p "$out"
          cp -r apps/web/.next/standalone/. "$out/"
          cp -r apps/web/public "$out/apps/web/public"
          cp -r apps/web/.next/static "$out/apps/web/.next/static"
          tar -czf "$RUNNER_TEMP/xapps.tgz" -C "$out" .
          ls -lh "$RUNNER_TEMP/xapps.tgz"

      - name: Ship and switch over
        if: steps.check.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          ssh_opts="-i $HOME/.ssh/deploy -o StrictHostKeyChecking=yes"
          id="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          scp $ssh_opts "$RUNNER_TEMP/xapps.tgz" deploy/droplet/activate.sh "xapps@$HOST:/opt/xapps/incoming/"
          ssh $ssh_opts "xapps@$HOST" "bash /opt/xapps/incoming/activate.sh '$id' /opt/xapps/incoming/xapps.tgz"
